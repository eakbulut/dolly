<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Dolly">
  <!-- A truck on a track. Astro's technique: the structural shape flips with
       the OS theme so one file works on any ground; the accent never moves. -->
  <style>.r{stroke:#0B0B0C}@media(prefers-color-scheme:dark){.r{stroke:#F2F2EE}}</style>
  <path class="r" d="M9.5 3v26M22.5 3v26" stroke-width="3.2" stroke-linecap="round"/>
  <rect x="4.5" y="12.5" width="23" height="8.5" rx="2.4" fill="#2B4BE8"/>
</svg>
