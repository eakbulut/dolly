<!-- dolly, monoline cursive, for the `draw` move.
     Two paths on purpose: the word is one unbroken stroke, then the pen lifts
     once for the flourish — which is what a hand does. Give them different
     --dolly-range values so the word finishes before the flourish starts;
     a single path with two subpaths shares one dash offset and draws both at
     once. No vector-effect: it computes dashes in screen space and shatters
     the stroke. Colour comes from CSS, never from this file. -->
