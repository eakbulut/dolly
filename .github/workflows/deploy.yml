name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests must pass before deploy
        run: npm test
      - name: Assemble site
        run: |
          mkdir -p _site/src
          cp index.html _site/
          cp src/dolly.css _site/src/
          cp -r assets _site/
          # Pages serves index.html for 10 minutes but css/images for 4 hours,
          # so a returning visitor gets new markup against a stale stylesheet
          # and the page breaks in ways that look like code bugs. Fingerprint
          # the two assets the markup is coupled to. The comment on line 28 and
          # the figcaption that prints the filename are deliberately not touched.
          CSS_V=$(sha1sum src/dolly.css | cut -c1-8)
          PNG_V=$(sha1sum assets/leader.png | cut -c1-8)
          sed -i "s|href=\"src/dolly.css\"|href=\"src/dolly.css?v=$CSS_V\"|" _site/index.html
          sed -i "s|url(\"assets/leader.png\")|url(\"assets/leader.png?v=$PNG_V\")|" _site/index.html
          sed -i "s|src=\"assets/leader.png\"|src=\"assets/leader.png?v=$PNG_V\"|" _site/index.html
          for want in "dolly.css?v=$CSS_V" "url(\"assets/leader.png?v=$PNG_V\")" "src=\"assets/leader.png?v=$PNG_V\""; do
            grep -qF "$want" _site/index.html || { echo "::error::fingerprint missed: $want"; exit 1; }
          done
          echo "usedolly.dev" > _site/CNAME
          printf 'User-agent: *\nAllow: /\nSitemap: https://usedolly.dev/sitemap.xml\n' > _site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n<url><loc>https://usedolly.dev/</loc></url>\n</urlset>\n' > _site/sitemap.xml
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v5
