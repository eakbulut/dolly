<!DOCTYPE html><html><head><meta charset="utf-8"><title>viewports</title>
<style>html,body{margin:0;background:#2a2a2a;font:12px system-ui;color:#999}
.row{display:flex;gap:16px;padding:16px;align-items:flex-start}
figure{margin:0}figcaption{padding:6px 2px}
iframe{border:0;background:#fff;display:block;box-shadow:0 6px 30px rgba(0,0,0,.5)}
.p{width:390px;height:844px}.t{width:768px;height:1024px}</style></head>
<body><div class="row">
<figure><figcaption>390 × 844 (iPhone)</figcaption><iframe class="p" src="/index.html"></iframe></figure>
<figure><figcaption>768 × 1024 (tablet)</figcaption><iframe class="t" src="/index.html"></iframe></figure>
</div></body></html>
