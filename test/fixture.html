<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dolly fixture</title>
<link rel="stylesheet" href="../src/dolly.css">
<style>
  body{margin:0;font:16px/1.5 system-ui}
  /* NOTE: never assert on getComputedStyle here. Scroll-driven animations are
     composited, so getComputedStyle reports the BASE value (opacity 1) even
     mid-animation. Verify these visually, with a screenshot. */
  .bar{position:fixed;top:0;left:0;height:4px;width:100%;background:#1E40AF;z-index:9}
  .sp{height:130vh}
  .b{height:90px;margin:60vh 20px;background:#1E40AF;color:#fff;padding:10px;font-family:monospace}
</style>
</head>
<body>
  <div class="bar" data-dolly="progress"></div>
  <div class="sp">scroll down</div>
  <div class="b" data-dolly="fade">fade</div>
  <div class="b" data-dolly="tilt-up">tilt-up</div>
  <div class="b" data-dolly="rack">rack</div>
  <div class="b" data-dolly="not-a-real-move">unknown move — must stay visible</div>
  <div class="sp"></div>
</body>
</html>
