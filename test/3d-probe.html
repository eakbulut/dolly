<!DOCTYPE html><html><head><meta charset="utf-8"><title>3d probe</title><style>
.scene{perspective:1200px;transform-style:preserve-3d;height:400px;position:relative;background:#111}
#a{width:200px;height:120px;background:#2B4BE8;translate:0 0 -400px;rotate:y 18deg}
#b{width:200px;height:120px;background:#c33;transform:translateZ(-400px) rotateY(18deg)}
</style></head><body>
<div class="scene"><div id="a">independent</div><div id="b">shorthand</div></div>
</body></html>
