<!DOCTYPE html><html><head><meta charset="utf-8"><title>events</title><style>
@keyframes f{from{opacity:0}}
.sp{height:150vh}
#t{height:80px;background:#2B4BE8;animation-name:f;animation-fill-mode:both;
   animation-timing-function:linear;animation-timeline:view();animation-range:entry 0% cover 40%}
</style></head><body>
<div class="sp"></div><div id="t"></div><div class="sp"></div>
<script>
window.__log=[];
const t=document.getElementById('t');
for (const ev of ['animationstart','animationend','animationcancel','animationiteration'])
  t.addEventListener(ev, e=>window.__log.push(ev+':'+Math.round(scrollY)));
</script></body></html>
